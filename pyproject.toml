[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-matching"
version = "1.0.0"
description = "Enterprise RAG-based resume-to-job profile matching system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaustubh Warke", email = "kaustubh.warke@nice.com" }]
keywords = ["rag", "embeddings", "vector-search", "resume-matching", "nlp"]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Embedding / vector backends (production defaults). Optional so the core
# package remains importable and testable without heavy ML dependencies.
embeddings = [
    "sentence-transformers>=2.6",
    "chromadb>=0.5",
]
openai = ["openai>=1.30"]
cohere = ["cohere>=5.5"]
loaders = [
    "pypdf>=4.2",
    "python-docx>=1.1",
]
notebook = ["jupyter>=1.0", "matplotlib>=3.8", "pandas>=2.2"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.10",
]
all = [
    "profile-matching[embeddings,openai,cohere,loaders,notebook,dev]",
]

[project.scripts]
resume-rag = "profile_matching.cli.resume_rag_cli:main"
job-matcher = "profile_matching.cli.job_matcher_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
